name: Student Grade API CI/CD

on:
push:
branches: [ "main" ]
pull_request:
branches: [ "main" ]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
- name: Checkout code
uses: actions/checkout@v4
with:
fetch-depth: 0

- name: Set up JDK 17
uses: actions/setup-java@v4
with:
java-version: '17'
distribution: 'temurin'
cache: maven

- name: Build and Test
run: mvn clean verify

- name: SonarQube Analysis
env:
SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
run: >
mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
-Dsonar.projectKey=rt-alsaif_Student-Grade-Api
-Dsonar.organization=rt-alsaif
-Dsonar.host.url=https://sonarcloud.io
-Dsonar.token=$SONAR_TOKEN

- name: Build Docker Image
env:
DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
run: docker build -t $DOCKER_USERNAME/student-grade-api:latest .

- name: Login to Docker Hub
if: github.event_name == 'push'
uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
with:
username: ${{ secrets.DOCKER_USERNAME }}
password: ${{ secrets.DOCKER_PASSWORD }}

- name: Push Docker Image
if: github.event_name == 'push'
env:
DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
run: docker push $DOCKER_USERNAME/student-grade-api:latest